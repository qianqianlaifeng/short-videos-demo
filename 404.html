<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面未找到 · SV Parser Demo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230d9488'/%3E%3Cpath d='M25 19l22 13-22 13z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./assets/style.css">
  <style>
    .e404 { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 30px; }
    .e404 .num { font: 800 clamp(5rem, 18vw, 10rem)/1 var(--mono); letter-spacing: -.08em;
      background: linear-gradient(100deg, var(--accent), #38bdf8); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .e404 h1 { margin: 4px 0 8px; font-size: 22px; letter-spacing: -.02em; }
    .e404 p { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
    .e404 a { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 22px;
      border-radius: 10px; background: var(--accent); color: #fff; font-weight: 700; font-size: 14px; }
    .e404 a:hover { text-decoration: none; background: var(--accent-hover); }
  </style>
</head>
<body>
  <div class="e404">
    <div>
      <div class="num">404</div>
      <h1>这个页面不存在</h1>

    </div>
  </div>
</body>
</html>
